name: Fetch ESPN Scores & Create Stories

on:
  schedule:
    # Run every 3 hours — covers all major US sports windows
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Number of days to backfill (default 2)'
        required: false
        default: '2'

jobs:
  fetch-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Fetch ESPN scores and create stories
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '2' }}
        run: node scripts/fetch-espn-scores.js
